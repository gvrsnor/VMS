<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏓%3C/text%3E%3C/svg%3E">
<title>Pingpong – kalender en uitslagen</title>
<style>
:root{--bg:#f1f4f6;--card:#fff;--ink:#14212b;--mute:#5b6b78;--line:#dbe2e8;--head:#0072bc;--link:#0072bc;--win:#1f7a4d;--loss:#b03a2e;--A:#1d5fa8;--B:#c2611a;--C:#23806d;--font:"Bahnschrift","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f161c;--card:#18222b;--ink:#e6edf2;--mute:#93a3b0;--line:#2a3640;--head:#2a8fd6;--link:#6ab6f0;--win:#5cc590;--loss:#f2897c;--A:#6aa8f0;--B:#f0a064;--C:#5cc7b2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font)}
header{background:#fff;color:#14212b;padding:.9rem 1rem 0;border-bottom:4px solid #f6931f}
.in{max-width:900px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.4rem}
h1{margin:0;line-height:0}
.logo{height:4.4rem;width:auto;display:block}
.meta{margin:0;color:#5b6b78;font-size:.8rem;text-align:right}
.pages{display:flex;gap:1.4rem}
.pages a{color:#3f5262;text-decoration:none;padding:.5rem 0;border-bottom:3px solid transparent;font-weight:700}
.pages a[aria-current=page]{color:#0072bc;border-color:#0072bc}
main{max-width:900px;margin:0 auto;padding:1.2rem 1rem 4rem}
a:focus-visible,button:focus-visible,input:focus-visible+span,summary:focus-visible{outline:2px solid var(--A);outline-offset:2px}
h2{font-size:1.15rem;margin:1.8rem 0 .6rem;font-weight:800}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.filters label{cursor:pointer}
.filters input{position:absolute;opacity:0}
.filters span{display:inline-flex;gap:.45rem;align-items:center;padding:.35rem .9rem;border:2px solid var(--line);border-radius:999px;background:var(--card);font-weight:600}
.filters input:checked+span{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.filters i,.badge{display:inline-grid;place-items:center;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--c);color:var(--card);font:800 .8rem/1 var(--font);font-style:normal;flex:none}
.filters input:not(:checked)+span i{background:var(--line);color:var(--mute)}
.t-A{--c:var(--A)}.t-B{--c:var(--B)}.t-C{--c:var(--C)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.cal-head h2{margin:0;text-transform:capitalize}
.cal-head button{font:inherit;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:8px;padding:.3rem .8rem;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dow{background:var(--bg);padding:.3rem;text-align:center;font-size:.8rem;color:var(--mute);font-weight:600}
.day{background:var(--card);min-height:5.6rem;padding:.25rem;display:flex;flex-direction:column;gap:2px;min-width:0}
.day.off{background:var(--bg);color:var(--mute)}
.day.today .n{background:var(--head);color:#fff;border-radius:50%}
.n{font-size:.8rem;width:1.5rem;height:1.5rem;display:grid;place-items:center}
.chip{display:flex;gap:.25rem;align-items:center;font-size:.72rem;line-height:1.2;padding:2px 4px 2px 2px;border-radius:6px;background:color-mix(in srgb,var(--c) 14%,var(--card));border-left:3px solid var(--c);min-width:0}
.chip .badge{display:none}
.chip em{font-style:normal;font-weight:800;color:var(--c)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.enc+.enc{border-top:1px solid var(--line)}
.venue{padding:0 .8rem .7rem 3.2rem;font-size:.85rem;color:var(--mute)}
.venue a,.note a{color:var(--link);font-weight:600}
.note{color:var(--mute);font-size:.9rem;margin:.2rem 0 1rem}
.lnk{font:inherit;font-weight:700;background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left}
.lnk::before{content:"▸";display:inline-block;width:1.1rem;color:var(--mute);transition:transform .15s}
.lnk[aria-expanded=true]::before{transform:rotate(90deg)}
tr.more td{background:color-mix(in srgb,var(--bg) 60%,var(--card));padding:.7rem .7rem .9rem 2.2rem}
tr.more p{margin:0 0 .5rem;font-size:.85rem;color:var(--mute)}
.vsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.4rem}
.vsgrid div{display:flex;justify-content:space-between;gap:.5rem;border:1px solid var(--line);border-radius:8px;padding:.25rem .6rem;background:var(--card)}
.vsgrid b{font-variant-numeric:tabular-nums}
summary{display:grid;grid-template-columns:auto 1fr auto;gap:.2rem .8rem;align-items:center;padding:.7rem .8rem;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.d{grid-column:2;grid-row:1;font-size:.8rem;color:var(--mute)}
summary .badge{grid-row:1/3}
.vs{grid-column:2;font-weight:600}
.s{grid-column:3;grid-row:1/3;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.s small{display:block;font-weight:600;font-size:.75rem}
.gewonnen{color:var(--win)}.verloren{color:var(--loss)}.gepland{color:var(--mute);font-weight:600}
ul.g{list-style:none;margin:0;padding:0 .8rem .8rem 3.2rem;font-size:.92rem}
ul.g li{padding:.2rem 0}
ul.g b{display:inline-block;min-width:3rem;font-variant-numeric:tabular-nums}
ul.g .w b{color:var(--win)}ul.g .l b{color:var(--loss)}
.r{color:var(--mute);font-size:.78rem;margin-right:.5rem}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem;background:var(--card)}
th,td{text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:.85rem}
td:nth-child(2),td:nth-child(3),td:nth-child(4){white-space:nowrap;font-variant-numeric:tabular-nums}
.err{color:var(--loss)}.empty{color:var(--mute)}
@media (max-width:620px){.day{min-height:4rem}.chip{justify-content:center;padding:2px}.chip span{display:none}.chip em{font-size:.7rem}h1{font-size:1.7rem}}
</style>
</head>
<body>
<header><div class="in">
  <div class="top">
    <h1><img class="logo" src="logo.png" width="373" height="157" alt="Tafeltennisclub VMS"></h1>
    <p class="meta" id="meta">Gegevens laden…</p>
  </div>
  <nav class="pages" id="pages"></nav>
</div></header>
<main id="view"></main>
<script>
const $ = (s) => document.querySelector(s);
const h = (t, a = {}, ...k) => {
  const e = document.createElement(t);
  for (const [x, v] of Object.entries(a)) x === "class" ? (e.className = v) : x.startsWith("on") ? e.addEventListener(x.slice(2), v) : e.setAttribute(x, v);
  e.append(...k.filter((x) => x != null && x !== false));
  return e;
};
const PAGES = { kalender: "Kalender", uitslagen: "Uitslagen", spelers: "Spelers" };
const ORDER = "A B0 B2 B4 B6 C0 C2 C4 C6 D0 D2 D4 D6 E0 E2 E4 E6 NG".split(" ");
const rk = (r) => { const i = ORDER.indexOf(r); return i < 0 ? 99 : i; };
const fmt = (d, o) => new Date(d + "T12:00:00").toLocaleDateString("nl-BE", o);
const names = (l) => l.map((p) => `${p.name} (${p.rank})`).join(" & ") || "—";
const S = { data: null, on: new Set(), month: null };

const sel = () => S.data.teams.filter((t) => S.on.has(t.team)).flatMap((t) => t.matches.map((m) => ({ ...m, team: t.team })))
  .sort((a, b) => (a.date || "9").localeCompare(b.date || "9"));
const badge = (t) => h("i", { class: "badge t-" + t }, t);
const result = (m) => m.ours == null ? "gepland" : m.ours > m.theirs ? "gewonnen" : m.ours < m.theirs ? "verloren" : "gelijk";

function filters() {
  return h("div", { class: "filters", role: "group", "aria-label": "Ploegen" }, ...S.data.teams.map(({ team }) =>
    h("label", { class: "t-" + team },
      h("input", { type: "checkbox", ...(S.on.has(team) ? { checked: "" } : {}), onchange: (e) => { e.target.checked ? S.on.add(team) : S.on.delete(team); render(); } }),
      h("span", {}, h("i", {}, team), "Ploeg " + team))));
}

function vs(m) {
  return h("span", { class: "vs" }, h("b", {}, m.home), " vs ", h("b", {}, m.away));
}

function encounter(m) {
  const res = result(m), pl = m.ours != null;
  const d = h("details", {}, h("summary", {}, badge(m.team),
    h("span", { class: "d" }, m.date ? fmt(m.date, { weekday: "long", day: "numeric", month: "long" }) + (m.time ? " · " + m.time : "") : "Datum nog niet bekend"),
    vs(m),
    h("span", { class: "s " + res }, pl ? `${m.ours} - ${m.theirs}` : "gepland", pl ? h("small", {}, res) : null)));
  if (m.games.length) {
    const ul = h("ul", { class: "g" });
    for (const g of m.games) {
      const won = g.os > g.ts;
      ul.append(h("li", { class: won ? "w" : "l" }, h("b", {}, `${g.os} - ${g.ts}`),
        h("span", { class: "r" }, g.forfeit ? "forfait" : won ? "gewonnen" : "verloren"),
        `${names(g.ours)} tegen ${names(g.theirs)}`));
    }
    d.append(ul);
  }
  const v = !pl && !m.isHome && m.venue;
  return h("div", { class: "enc" }, d, v ? h("div", { class: "venue" }, "📍 " + [v.name, v.address].filter(Boolean).join(", ") + " · ",
    h("a", { href: "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(v.address), target: "_blank", rel: "noopener" }, "Route in Google Maps")) : null);
}

function calendar() {
  const y = S.month.getFullYear(), mo = S.month.getMonth();
  const pad = (n) => String(n).padStart(2, "0");
  const key = (yy, mm, dd) => `${yy}-${pad(mm + 1)}-${pad(dd)}`;
  const all = sel(), by = {};
  for (const m of all) (by[m.date] ||= []).push(m);
  const lead = (new Date(y, mo, 1).getDay() + 6) % 7, days = new Date(y, mo + 1, 0).getDate();
  const t = new Date(), today = key(t.getFullYear(), t.getMonth(), t.getDate());
  const g = h("div", { class: "grid" }, ...["ma", "di", "wo", "do", "vr", "za", "zo"].map((x) => h("div", { class: "dow" }, x)));
  for (let i = 0; i < Math.ceil((lead + days) / 7) * 7; i++) {
    const d = new Date(y, mo, 1 - lead + i), k = key(d.getFullYear(), d.getMonth(), d.getDate());
    const cell = h("div", { class: "day" + (d.getMonth() !== mo ? " off" : "") + (k === today ? " today" : "") }, h("span", { class: "n" }, d.getDate()));
    for (const m of by[k] || []) {
      const opp = m.isHome ? m.away : m.home;
      cell.append(h("div", { class: "chip t-" + m.team, title: `${m.home} vs ${m.away}` },
        h("em", {}, m.team), h("span", {}, m.ours == null ? `${m.time} ${opp}` : `${m.ours} - ${m.theirs} ${opp}`)));
    }
    g.append(cell);
  }
  const step = (n) => () => { S.month = new Date(y, mo + n, 1); render(); };
  const list = all.filter((m) => m.date.startsWith(`${y}-${pad(mo + 1)}`));
  return [
    h("div", { class: "cal-head" }, h("button", { onclick: step(-1), "aria-label": "Vorige maand" }, "‹"),
      h("h2", {}, S.month.toLocaleDateString("nl-BE", { month: "long", year: "numeric" })),
      h("button", { onclick: step(1), "aria-label": "Volgende maand" }, "›")),
    g,
    h("h2", {}, "Ontmoetingen deze maand"),
    list.length ? h("div", { class: "card" }, ...list.map(encounter)) : h("p", { class: "empty" }, "Geen ontmoetingen in deze maand.")];
}

function results() {
  const all = sel(), up = all.filter((m) => m.ours == null), done = all.filter((m) => m.ours != null).reverse();
  const block = (title, l) => [h("h2", {}, title), l.length ? h("div", { class: "card" }, ...l.map(encounter)) : h("p", { class: "empty" }, "Niets te tonen.")];
  return [...block("Komende ontmoetingen", up), ...block("Gespeelde ontmoetingen", done)];
}

function players() {
  const st = new Map();
  for (const m of S.data.teams.flatMap((t) => t.matches)) for (const g of m.games) {
    if (g.forfeit || g.os === g.ts) continue;
    const won = g.os > g.ts, dbl = g.ours.length > 1;
    for (const p of g.ours) {
      const e = st.get(p.id) || { single: [0, 0], double: [0, 0], vs: {} };
      e[dbl ? "double" : "single"][won ? 0 : 1]++;
      if (!dbl) { const k = (g.theirs[0] && g.theirs[0].rank) || "?"; (e.vs[k] ||= [0, 0])[won ? 0 : 1]++; }
      st.set(p.id, e);
    }
  }
  const people = new Map(S.data.members.map((p) => [p.id, p]));
  for (const m of S.data.teams.flatMap((t) => t.matches)) for (const g of m.games) for (const p of g.ours) if (!people.has(p.id)) people.set(p.id, p);
  const list = [...people.values()].sort((a, b) => rk(a.rank) - rk(b.rank) || a.name.localeCompare(b.name));
  const wl = (a) => a.join(" - ");
  const tb = h("tbody");
  for (const p of list) {
    const e = st.get(p.id), single = e && e.single[0] + e.single[1] > 0;
    const more = h("tr", { class: "more", hidden: "" }, h("td", { colspan: "4" },
      single ? h("p", {}, "Resultaten in enkel per klassement van de tegenstander (gewonnen - verloren)") : h("p", {}, "Nog geen enkelmatchen gespeeld dit seizoen."),
      single ? h("div", { class: "vsgrid" }, ...Object.entries(e.vs).sort(([a], [b]) => rk(a) - rk(b)).map(([k, v]) => h("div", {}, h("span", {}, k), h("b", {}, wl(v))))) : null));
    const btn = h("button", { class: "lnk", "aria-expanded": "false", onclick: () => { const o = more.hidden; more.hidden = !o; btn.setAttribute("aria-expanded", String(o)); } }, p.name);
    tb.append(h("tr", {}, h("td", {}, btn), h("td", {}, p.rank), h("td", {}, e ? wl(e.single) : "–"), h("td", {}, e ? wl(e.double) : "–")), more);
  }
  return [h("h2", {}, `Spelers (${list.length})`),
    h("p", { class: "note" }, "Klik op een speler voor meer details. Je verwachte klassement op het einde van het seizoen kan je berekenen op ",
      h("a", { href: "https://klassement.ttcoach.be/?lang=nl", target: "_blank", rel: "noopener" }, "klassement.ttcoach.be"), " (indicatief, niet van de VTTL)."),
    h("div", { class: "card wrap" }, h("table", {}, h("thead", {}, h("tr", {}, ...["Speler", "Klassement", "Enkel", "Dubbel"].map((x) => h("th", {}, x)))), tb))];
}

function render() {
  const page = (location.hash.slice(1) in PAGES) ? location.hash.slice(1) : "kalender";
  $("#pages").replaceChildren(...Object.entries(PAGES).map(([k, v]) => h("a", { href: "#" + k, ...(k === page ? { "aria-current": "page" } : {}) }, v)));
  const body = { kalender: calendar, uitslagen: results, spelers: players }[page]();
  $("#view").replaceChildren(...(page === "spelers" ? body : [filters(), ...body]));
}

fetch("/api/data").then((r) => r.json()).then((d) => {
  if (d.error) throw new Error(d.error);
  S.data = d; S.on = new Set(d.teams.map((t) => t.team));
  const n = new Date(); S.month = new Date(n.getFullYear(), n.getMonth(), 1);
  $("#meta").textContent = "Bijgewerkt op " + new Date(d.updated).toLocaleString("nl-BE", { dateStyle: "medium", timeStyle: "short" });
  render();
}).catch((e) => { $("#meta").textContent = ""; $("#view").replaceChildren(h("p", { class: "err" }, "De gegevens konden niet geladen worden: " + e.message)); });
addEventListener("hashchange", () => S.data && render());
</script>
</body>
</html>
